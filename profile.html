<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff;padding-bottom:80px}
.top{display:flex;justify-content:space-between;padding:12px 15px;font-size:22px}
.head{display:flex;justify-content:space-between;padding:5px 15px}
.head h1{font-size:28px}.head p{color:#aaa;font-size:14px;margin-top:2px}
.pic{position:relative}.pic img{width:95px;height:95px;border-radius:50%;object-fit:cover}
.pic b{position:absolute;bottom:0;right:0;background:#00d2ff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid #000}
.stats{display:flex;gap:18px;padding:10px 15px}.stats b{font-size:18px}.stats span{color:#aaa;font-size:13px}
.bio{padding:0 15px;font-size:15px}.sub{margin:10px 15px;display:inline-block;border:1px solid #444;border-radius:20px;padding:6px 12px;font-size:14px}
.tabs{display:flex;justify-content:space-around;padding:12px 0;border-bottom:1px solid #222;font-size:22px;color:#888}.tabs .on{color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px}.grid div{position:relative}.grid img{width:100%;height:170px;object-fit:cover;display:block}.grid i{position:absolute;top:5px;left:50%;transform:translateX(-50%);background:#e91e63;padding:2px 8px;border-radius:4px;font-size:12px;font-style:normal}.grid span{position:absolute;bottom:5px;left:5px;font-size:13px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #222;font-size:12px;text-align:center}.nav a{color:#fff;text-decoration:none}.nav a.on{color:#fff}
</style></head><body>
<div class="top"><span>✎</span><span>👥 👤+ ☰</span></div>
<div class="head"><div><h1>__NAME__ ▾</h1><p>@__USERNAME__ · Artist</p></div><div class="pic"><img src="__PIC__"><b>+</b></div></div>
<div class="stats"><div><b>__FOLLOWING__</b><br><span>Following</span></div><div><b>__FOLLOWERS__</b><br><span>Followers</span></div><div><b>__LIKES__</b><br><span>Likes</span></div></div>
<div class="bio">__BIO__ 😇❤️😇</div>
<div class="sub">🚀 Subscription</div>
<div class="tabs"><span>♫</span><span class="on">▦ ▾</span><span>🔒</span><span>⇄</span><span>🔖</span><span>♡</span></div>
<div class="grid">__GRID__</div>
<div class="nav"><a href="/">🏠<br>Home</a><a href="/">👥<br>Friends</a><a href="/upload">➕</a><a href="/">💬<br>Inbox</a><a href="/profile" class="on">👤<br>You</a></div>
</body></html>
